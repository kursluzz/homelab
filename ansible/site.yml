# Configures every host. Run from ansible/ (asks for the sudo password):
#   ansible-playbook site.yml -l orion   # one host
#   ansible-playbook site.yml            # all hosts
- name: Base tools on every host
  hosts: all
  become: true
  roles:
    - docker
    - uv

# A network change; one host at a time, and a failure stops the run before the
# next host.
- name: LAN bridge for the VMs
  hosts: all
  become: true
  serial: 1
  roles:
    - bridge
