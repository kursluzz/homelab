# Configures every server. Run from ansible/ (asks for the servers' sudo
# password), after workstation.yml:
#   ansible-playbook site.yml -l orion   # one server
#   ansible-playbook site.yml            # all servers

- name: Base tools on every server
  hosts: servers
  become: true
  roles:
    - docker
    - uv

# A network change; one host at a time, and a failure stops the run before the
# next host.
- name: LAN bridge for the VMs
  hosts: servers
  become: true
  serial: 1
  roles:
    - bridge

- name: Incus on every server
  hosts: servers
  become: true
  roles:
    - incus

# The cluster switch and the nightly lab shutdown (ADR 0007). The home server
# play runs first: the lab hosts need its power-off key.
- name: Cluster switch and nightly lab shutdown on the home server
  hosts: home
  become: true
  roles:
    - cluster_switch

- name: Lab hosts accept the home server's power-off key
  hosts: lab
  become: true
  roles:
    - lab_poweroff

# Remote access (ADR 0008).
- name: WireGuard VPN on the home server
  hosts: home
  become: true
  roles:
    - wireguard
