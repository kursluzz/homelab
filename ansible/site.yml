# Configures every server. Run from ansible/ (asks for the servers' sudo
# password), after workstation.yml:
#   ansible-playbook site.yml -l orion   # one server
#   ansible-playbook site.yml            # all servers

- name: Base tools on every server
  hosts: servers
  become: true
  roles:
    - docker
    - uv

# A network change; one host at a time, and a failure stops the run before the
# next host.
- name: LAN bridge for the VMs
  hosts: servers
  become: true
  serial: 1
  roles:
    - bridge

- name: Incus on every server
  hosts: servers
  become: true
  roles:
    - incus
