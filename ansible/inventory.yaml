# Physical hosts: the only place their addresses and MACs live.
# VMs, node addresses and sizes are in terraform/terraform.tfvars, which refers
# to these hosts and their Incus storage pools by name. Host names, pool names
# and the bridge name must match in both files.
all:
  vars:
    # Ubuntu 26.04 ships sudo-rs as sudo. It wraps a custom prompt in its own
    # text ("[sudo: <prompt>] Password:"), so Ansible never sees its marker and
    # times out. sudo.ws is the classic sudo, installed alongside.
    ansible_become_exe: sudo.ws
    ansible_python_interpreter: /usr/bin/python3
  children:
    servers:
      vars:
        nic: enp0s31f6 # onboard NIC on every host; Wake-on-LAN stays on it
        bridge: br0    # LAN bridge the VMs attach to; the bridge keeps the NIC's MAC
        # Incus storage pools ("dir" driver): name -> directory. An empty
        # directory means Incus' own location under /var/lib/incus.
        incus_pools:
          default: ""
      children:
        # Always on: personal services, VPN endpoint, Wake-on-LAN relay.
        home:
          hosts:
            saturn:
              ansible_host: 192.168.0.21
              mac: "50:9a:4c:2a:9a:07"
              incus_pools:
                ssd: "" # 1 TB system SSD (Incus' own location under /var/lib/incus)
              incus_default_pool: ssd
              # WireGuard VPN server (ADR 0008). Clients route only the tunnel and
              # the lab's part of the LAN (.16-.99: hosts, Kubernetes API and
              # nodes, LoadBalancer IPs), so a remote network that also uses
              # 192.168.0.0/24 keeps its own router and devices.
              wireguard:
                address: 10.250.0.1/24
                port: 51820
                client_allowed_ips:
                  - 10.250.0.0/24
                  - 192.168.0.16/28
                  - 192.168.0.32/27
                  - 192.168.0.64/27
                  - 192.168.0.96/30
                peers:
                  orbit: { address: 10.250.0.2, public_key: "SO4vBPlOsObtw+fFSHF5rMQU0H5YRR0Gw6r/PjslHFQ=" }
                  phone: { address: 10.250.0.3, public_key: "VEs8ld89x5islLVSX8Kc55Kix4lx08/MO5a5PZ9jrBI=" }
        # Powered on over Wake-on-LAN for experiments.
        lab:
          hosts:
            triton:
              ansible_host: 192.168.0.22
              mac: "30:9c:23:77:77:85"
              incus_pools:
                default: ""            # 512 GB NVMe (root)
                ssd: /mnt/monaco/incus # 1 TB SATA SSD, worker disks
            orion:
              ansible_host: 192.168.0.23
              mac: "30:9c:23:77:59:58"
    # The machine Ansible, Terraform and the cluster tools run from.
    workstation:
      hosts:
        orbit:
          ansible_connection: local
