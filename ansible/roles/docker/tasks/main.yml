# Docker Engine from Docker's apt repository; the distro's docker.io lags behind.
# state: present installs but never upgrades, so a run never restarts running
# containers. Upgrades go through apt.
- name: Add the Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts.distribution_release }}"
    components: stable
    signed_by: https://download.docker.com/linux/ubuntu/gpg

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    # Always refresh: with cache_valid_time, a cache refreshed shortly before the
    # repository was added hides docker-ce. A refresh alone is not a change.
    update_cache: true

- name: Start Docker at boot
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Let users run docker without sudo
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
