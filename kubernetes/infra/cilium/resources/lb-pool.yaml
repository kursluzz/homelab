# LoadBalancer IPs for Services (LAN plan: .70-.99, see terraform.tfvars).
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan
spec:
  blocks:
    - start: 192.168.0.70
      stop: 192.168.0.99
---
# Answer ARP for those IPs from one elected node, on the node's LAN interface.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan
spec:
  loadBalancerIPs: true
  interfaces:
    - ^eth[0-9]+$
