# Talos user volume on every worker's data disk (terraform/talos.tf).
nodePathMap:
  - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
    paths:
      - /var/mnt/local-path-provisioner

storageClass:
  name: local-path
  defaultClass: true
  # Bind when the pod is scheduled, so the volume is created on that node.
  volumeBindingMode: WaitForFirstConsumer
  reclaimPolicy: Delete

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
