# Cluster essential (ADR 0004): runs on the always-on pool, so GitOps keeps
# working while the lab hosts are off.
global:
  tolerations:
    - { key: homelab/node-pool, operator: Equal, value: always-on, effect: NoSchedule }
  affinity:
    podAntiAffinity: none
    nodeAffinity:
      type: soft
      matchExpressions:
        - { key: homelab/node-pool, operator: In, values: [always-on] }

configs:
  params:
    # Plain HTTP inside the cluster; TLS terminates at the gateway later.
    server.insecure: true
  cm:
    # Hide resources Argo CD should not track as drift.
    resource.exclusions: |
      - apiGroups: [cilium.io]
        kinds: [CiliumIdentity]
        clusters: ["*"]

# Not used yet: SSO (dex) and notifications.
dex:
  enabled: false
notifications:
  enabled: false

server:
  # A LAN address from the Cilium LoadBalancer pool.
  service:
    type: LoadBalancer
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }

controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

repoServer:
  resources:
    requests: { cpu: 20m, memory: 128Mi }
    limits: { memory: 512Mi }

applicationSet:
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 256Mi }

redis:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
